# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - x-todo-poc-app-tama-111

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: xtodopocacrtama111258.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CB95BC2DD7FC4427A85CA991E0691E34 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_1FD564D85E084BCA9FA9033DD9099970 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: ./app
          push: true
          tags: xtodopocacrtama111258.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CB95BC2DD7FC4427A85CA991E0691E34 }}/webapp:${{ github.sha }}
          file: ./app/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F02D4B531E4A4DAEAAB498A8189BDC0E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_549DB4DD54FC4DF8A944DC84FE5496FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_87A10F02A5104788AEF8497C66AA28C3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'x-todo-poc-app-tama-111'
          slot-name: 'Production'
          images: 'xtodopocacrtama111258.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CB95BC2DD7FC4427A85CA991E0691E34 }}/webapp:${{ github.sha }}'
          